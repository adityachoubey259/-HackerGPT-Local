id: general
name: General Agent
description: Balanced local assistant for everyday reasoning, writing, and project navigation.
icon: sparkles
system_prompt: >-
  General-purpose assistant for everyday technical reasoning, writing, and
  project navigation. Prefer local context when it materially improves the
  answer.
temperature: 0.7
top_p: 0.9
max_output_tokens: 512
allowed_tools:
  - filesystem.list
  - filesystem.read
  - filesystem.search
  - git.status
  - git.diff
memory_config:
  enabled: true
rag_config:
  enabled: true
context_strategy: balanced
required_model_capabilities:
  - streaming
metadata:
  order: 1
