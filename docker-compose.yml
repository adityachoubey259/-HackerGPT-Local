services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      HACKERGPT_API_HOST: 0.0.0.0
      HACKERGPT_API_PORT: 8000
      HACKERGPT_DATABASE_URL: sqlite+aiosqlite:///./data/databases/hackergpt.db
      HACKERGPT_SERVE_FRONTEND: "true"
      HACKERGPT_FRONTEND_DIST_DIR: ./frontend/dist
      HACKERGPT_OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - hackergpt-data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  searxng:
    image: searxng/searxng:latest
    profiles: ["research"]
    ports:
      - "8088:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8088/

volumes:
  hackergpt-data:
  qdrant-data:
