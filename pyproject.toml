[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hackergpt-local"
version = "1.0.0rc1"
description = "Local-first, provider-independent AI platform foundation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "HackerGPT Local Contributors" }]
dependencies = [
  "alembic>=1.14.0",
  "aiosqlite>=0.20.0",
  "defusedxml>=0.7.1",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "PyYAML>=6.0.2",
  "SQLAlchemy>=2.0.36",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]
training = [
  "accelerate>=0.33.0",
  "datasets>=2.20.0",
  "peft>=0.12.0",
  "safetensors>=0.4.3",
  "torch>=2.3.0",
  "transformers>=4.44.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=backend --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
  "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["yaml.*", "defusedxml.*"]
ignore_missing_imports = true
